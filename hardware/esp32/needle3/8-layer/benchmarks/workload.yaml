# Needle 3 frozen agent-watch workload: 12 cases from iammrduncan/esp32-needle-3
# benchmarks/tasks.json (sha256 07689be5089dcce5232d8604921777c3cd0365bf7f44305508c3d4968e768692), with the firmware's own
# tool schemas: tools/demo-tools.json (305a99e4cc84) for "tools" cases and
# tools/model-routes.json (419bf26a282e) for "route" cases.
# Upstream note: .auto/prompts.json, frozen project benchmark; these are not official JevBench or Needle 3 scores.
# Each case names the bridge model for its phase: needle3 (tools) or needle3-router (route).
# A project workload for regression and speed; not a public benchmark score.
cases:
- id: sampling5
  phase: tools
  model: needle3
  messages:
  - role: user
    content: Sample telemetry every 5 seconds
  tools:
  - type: function
    function: &id001
      name: get_status
      description: Read device uptime, free memory, telemetry and timer status.
      parameters:
        type: object
        properties: {}
        required: []
  - type: function
    function: &id002
      name: set_sampling_interval
      description: Set how often the device samples telemetry, in seconds.
      parameters:
        type: object
        properties:
          seconds:
            type: integer
            minimum: 1
            maximum: 3600
        required:
        - seconds
  - type: function
    function: &id003
      name: set_timer
      description: Start a countdown timer for the given number of seconds.
      parameters:
        type: object
        properties:
          seconds:
            type: integer
            minimum: 1
            maximum: 3600
        required:
        - seconds
  expect:
  - name: set_sampling_interval
    arguments:
      seconds: 5
  max_tokens: 64
- id: timer60
  phase: tools
  model: needle3
  messages:
  - role: user
    content: Start a 60 second timer
  tools:
  - type: function
    function: *id001
  - type: function
    function: *id002
  - type: function
    function: *id003
  expect:
  - name: set_timer
    arguments:
      seconds: 60
  max_tokens: 64
